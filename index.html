<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Function Hall Booking</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
<h1>Function Hall Booking</h1>
<p>Hall • Chairs • Decoration • Food • Payment</p>
</header>

<main class="container">
<section class="card">
<h2>1. Booking Details</h2>

<label>Function Hall</label>
<select id="hall">
<option value="50000">Royal Function Hall - ₹50,000</option>
<option value="35000">Sri Lakshmi Hall - ₹35,000</option>
<option value="25000">Mini Celebration Hall - ₹25,000</option>
</select>

<label>Booking Date</label>
<input type="date" id="bookingDate">

<label>Chairs</label>
<select id="chairs">
<option value="0">Without Chairs - ₹0</option>
<option value="10000">With Chairs - ₹10,000</option>
</select>

<label>Decoration</label>
<select id="decoration">
<option value="0">No Decoration - ₹0</option>
<option value="8000">Basic Decoration - ₹8,000</option>
<option value="15000">Premium Decoration - ₹15,000</option>
</select>

<label>Food</label>
<select id="food">
<option value="0">No Food</option>
<option value="300">Veg - ₹300/person</option>
<option value="450">Non-Veg - ₹450/person</option>
</select>

<label>Number of Guests</label>
<input type="number" id="guests" min="1" value="100">

<button type="button" onclick="calculateTotal()">Calculate Total</button>
<div id="summary" class="summary"></div>
</section>

<section class="card" id="paymentSection" style="display:none;">
<h2>2. Payment</h2>

<p class="note">Demo payment screen. Do not enter real card or banking details.</p>

<label>Payment Method</label>
<select id="paymentMethod" onchange="showPaymentFields()">
<option value="">Select Payment Method</option>
<option value="UPI">UPI</option>
<option value="CARD">Debit/Credit Card</option>
<option value="NETBANKING">Net Banking</option>
<option value="CASH">Pay at Hall</option>
</select>

<div id="upiFields" class="payment-fields">
<label>Demo UPI ID</label>
<input type="text" id="upiId" placeholder="example@upi">
</div>

<div id="cardFields" class="payment-fields">
<label>Demo Card Number</label>
<input type="text" id="cardNumber" maxlength="19" placeholder="1111 2222 3333 4444">
<label>Demo Expiry</label>
<input type="text" id="expiry" placeholder="MM/YY">
<label>Demo CVV</label>
<input type="password" id="cvv" maxlength="3" placeholder="123">
</div>

<div id="bankFields" class="payment-fields">
<label>Select Bank</label>
<select id="bank">
<option value="">Select Bank</option>
<option>State Bank of India</option>
<option>HDFC Bank</option>
<option>ICICI Bank</option>
<option>Axis Bank</option>
</select>
</div>

<div id="cashFields" class="payment-fields">
<p>Payment will be made at the function hall.</p>
</div>

<button type="button" onclick="processPayment()">Pay / Confirm Booking</button>
<div id="paymentResult"></div>
</section>
</main>

<script src="js/app.js"></script>
</body>
</html>
